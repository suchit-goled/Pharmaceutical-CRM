[project]
name = "pharma-care"
version = "2.0.0"
description = "PharmaCare - Enterprise AI Pharmaceutical CRM, Field Detailing & Healthcare Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pyjwt>=2.9.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-groq>=0.1.0",
    "requests>=2.32.0",
    "starlette>=0.38.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
